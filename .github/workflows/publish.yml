name: Publish

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Candidate publish first; promote only after every consumer passes.
        required: true
        type: choice
        options:
          - publish-candidate
          - verify-candidate
          - promote-latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use trusted-publishing npm client
        run: npm install --global npm@11.21.2

      - name: Install dependencies
        if: inputs.operation == 'publish-candidate'
        run: npm ci

      - name: Verify package
        if: inputs.operation == 'publish-candidate'
        run: npm test && npm run typecheck && npm run build && npm run tarball:verify && npm run consumer:test

      - name: Publish immutable candidate
        if: inputs.operation == 'publish-candidate'
        run: |
          version=$(node -p "require('./package.json').version")
          latest_before=$(npm view @frontstead/ui dist-tags.latest)
          if npm view "@frontstead/ui@$version" version >/dev/null 2>&1; then
            echo "@frontstead/ui@$version already exists; versions are immutable." >&2
            exit 1
          fi
          npm publish --tag candidate
          for attempt in {1..24}; do
            latest=$(npm view @frontstead/ui dist-tags.latest 2>/dev/null || true)
            candidate=$(npm view @frontstead/ui dist-tags.candidate 2>/dev/null || true)
            if [ "$latest" = "$latest_before" ] && [ "$candidate" = "$version" ]; then
              exit 0
            fi
            echo "Waiting for registry tags (attempt $attempt): latest=$latest candidate=$candidate"
            sleep 5
          done
          echo "Registry tags did not settle to latest=$latest_before candidate=$version" >&2
          exit 1

      - name: Verify published candidate
        if: inputs.operation == 'verify-candidate'
        run: |
          version=$(node -p "require('./package.json').version")
          for attempt in {1..24}; do
            latest=$(npm view @frontstead/ui dist-tags.latest 2>/dev/null || true)
            candidate=$(npm view @frontstead/ui dist-tags.candidate 2>/dev/null || true)
            provenance=$(npm view "@frontstead/ui@$version" dist.attestations.provenance.predicateType 2>/dev/null || true)
            if [ "$latest" != "$version" ] && [ "$candidate" = "$version" ] && [ "$provenance" = "https://slsa.dev/provenance/v1" ]; then
              exit 0
            fi
            echo "Waiting for candidate metadata (attempt $attempt): latest=$latest candidate=$candidate provenance=$provenance"
            sleep 5
          done
          echo "Candidate metadata did not settle for @frontstead/ui@$version" >&2
          exit 1

      - name: Promote verified candidate
        if: inputs.operation == 'promote-latest'
        run: |
          version=$(node -p "require('./package.json').version")
          test "$(npm view @frontstead/ui dist-tags.candidate)" = "$version"
          npm dist-tag add "@frontstead/ui@$version" latest
          npm dist-tag rm @frontstead/ui candidate
          for attempt in {1..24}; do
            latest=$(npm view @frontstead/ui dist-tags.latest 2>/dev/null || true)
            candidate=$(npm view @frontstead/ui dist-tags.candidate 2>/dev/null || true)
            if [ "$latest" = "$version" ] && [ -z "$candidate" ]; then
              exit 0
            fi
            echo "Waiting for promoted tags (attempt $attempt): latest=$latest candidate=$candidate"
            sleep 5
          done
          echo "Registry tags did not settle to latest=$version with no candidate tag" >&2
          exit 1
